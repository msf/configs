# Shared SSH client defaults. ~/.ssh/config includes private host blocks
# (~/.ssh/config.d/*, outside this public repo) first, then this file, so
# host-specific values take precedence.
# Works on macOS and Linux: UseKeychain is Apple-only and ignored elsewhere.

IgnoreUnknown UseKeychain

Host *
    # Passphrases are stored in the macOS login keychain; keys are loaded into
    # the system ssh-agent on first use. No third-party agent.
    AddKeysToAgent yes
    UseKeychain yes
    IdentityFile ~/.ssh/id_ed25519
    IdentityFile ~/.ssh/id_ed25519_fw13

    ControlMaster auto
    ControlPath ~/.ssh/cm/%C
    ControlPersist 10m

    ServerAliveInterval 30
    ServerAliveCountMax 4
    # ForwardAgent stays off here; enable it per trusted host.
