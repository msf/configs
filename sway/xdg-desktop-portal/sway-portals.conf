# Portal backends for the vanilla sway session (XDG_CURRENT_DESKTOP=sway).
# Without this, xdg-desktop-portal may bind the gnome backend, which times
# out waiting for mutter and stalls every GTK app launch by ~20s.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
